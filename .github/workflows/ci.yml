name: Contract CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.1.4

      - name: Cache Rust dependencies
        uses: stellar/actions/rust-cache@main

      - name: Run unit tests
        run: cargo test --workspace

      - name: Build contract WASM
        run: stellar contract build --package event-pass

      - name: Upload contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: event-pass-wasm
          path: target/wasm32v1-none/release/event_pass.wasm
